name: ARM64 Build and Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the ARM64 package to the download site
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  ROBOT_MODEL: ELF3
  PACKAGE_NAME: bxi_rl_controller_ros2_example
  PACKAGE_TARGET_PATH: /opt/bxi/bxi_rl_controller_ros2_example
  BXI_ROS2_REF: arm64

jobs:
  build-and-release:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/sloretz/ros:humble-desktop-full
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Mark Workspace as Safe Git Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate Version Tag
        run: |
          TIME_TAG=$(date +'%y%m%d')
          VERSION="v${TIME_TAG}-${GITHUB_SHA:0:7}"
          echo "tag_name=${VERSION}" >> "$GITHUB_ENV"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-arm64-ccache-${{ github.ref }}
          update-package-index: true
          restore-keys: |
            ${{ runner.os }}-arm64-ccache-

      - name: Fetch bxi_ros2_pkg
        run: |
          mkdir -p /opt/bxi
          git clone --depth 1 --branch "$BXI_ROS2_REF" \
            https://github.com/bxirobotics/bxi_ros2_pkg.git /opt/bxi/bxi_ros2_pkg

      - name: Build Controller Package
        run: |
          bash -c "
            set -e
            source /opt/ros/humble/setup.bash
            source /opt/bxi/bxi_ros2_pkg/setup.bash
            mkdir -p ${PACKAGE_TARGET_PATH}
            colcon build --merge-install --install-base ${PACKAGE_TARGET_PATH} --cmake-args \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=On \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -Wall -Wextra -Wpedantic
          "

      - name: Write Package Metadata
        run: |
          printf '%s\n' "${{ env.tag_name }}" | tee "${PACKAGE_TARGET_PATH}/.version" >/dev/null
          chmod 444 "${PACKAGE_TARGET_PATH}/.version"

      - name: Package Artifact
        run: |
          ARTIFACT="${PACKAGE_NAME}_${{ env.tag_name }}.tar.gz"
          tar -czvf "${ARTIFACT}" -C /opt/bxi "${PACKAGE_NAME}"
          sha256sum "${ARTIFACT}" > "${ARTIFACT}.sha256"

      - name: Prepare Release Artifact
        run: |
          RELEASE_ARTIFACT="${PACKAGE_NAME}_${{ env.tag_name }}_arm64.tar.gz"
          cp "${PACKAGE_NAME}_${{ env.tag_name }}.tar.gz" "${RELEASE_ARTIFACT}"
          sha256sum "${RELEASE_ARTIFACT}" > "${RELEASE_ARTIFACT}.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bxi_rl_controller_ros2_example_arm64_package
          path: |
            bxi_rl_controller_ros2_example_${{ env.tag_name }}_arm64.tar.gz
            bxi_rl_controller_ros2_example_${{ env.tag_name }}_arm64.tar.gz.sha256
          retention-days: 7

      - name: SCP Upload Package Files
        if: github.event_name == 'push' || inputs.upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: bxi_rl_controller_ros2_example_${{ env.tag_name }}.tar.gz,bxi_rl_controller_ros2_example_${{ env.tag_name }}.tar.gz.sha256
          target: ${{ secrets.DEPLOY_PATH }}/arm64/${{ env.PACKAGE_NAME }}

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: "Release ${{ env.tag_name }}"
          files: |
            bxi_rl_controller_ros2_example_${{ env.tag_name }}_arm64.tar.gz
            bxi_rl_controller_ros2_example_${{ env.tag_name }}_arm64.tar.gz.sha256
          generate_release_notes: true
