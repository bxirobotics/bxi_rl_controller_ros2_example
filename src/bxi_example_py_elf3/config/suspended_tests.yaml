/**:
  ros__parameters:
    # A 键全行程测试的峰值关节速度，单位：度/秒。
    # 越小越慢；仿真调试上限 1000.0，实机上限为 180.0。
    limb_test_range_speed_deg_s: 180.0

    # 小行程段的最短移动时间。大行程会自动延长以满足上面的速度限制。
    limb_test_move_sec: 1.5

    # 到达每个全行程目标后的保持及反馈检查时间。
    limb_test_hold_sec: 0.2

    # 已扫描自碰撞边界和机械限位两端保留的角度。
    limb_test_collision_margin_deg: 10.0
    limb_test_mechanical_margin_deg: 2.0

    # 目标与实测关节位置的允许误差。
    limb_test_tracking_tolerance_deg: 2.0

    # A 键启动及全零姿态稳定判定允许误差；用于容纳实机关节静差。
    limb_test_start_tolerance_deg: 5.0

    # Y 键启动振动前，实测关节位置允许偏离目标振动中心的最大误差。
    # 误差在 0.1 rad 内时，按目标中心启动振动，不把实测偏差当作新的中心。
    vibration_start_center_tolerance_rad: 0.1

    # Y 键振动启动包络的实测零位微小余量。仅放宽启动判定；实际发布的
    # 0.22 rad 振动指令仍会由原软件关节限位裁剪，不会突破软件边界。
    vibration_start_envelope_slack_rad: 0.001

    # STL 外观网格在线碰撞检查周期，单位：秒。
    limb_test_visual_check_period_sec: 0.05
