initial_state: zero_torque
graph:
  validate: true
  export:
    dot: /tmp/elf3_state_machine.dot
    mermaid: /tmp/elf3_state_machine.mmd
remote_events:
  normal_event:
    slot: btn_1
    value: 1
  zero_torque_event:
    slot: btn_2
    value: 1
  pd_brake_event:
    slot: btn_3
    value: 1
  initial_pos_event:
    slot: btn_4
    value: 1
  dance_event:
    slot: btn_5
    value: 1
  recover_event:
    slot: btn_6
    value: 1
  normal_run_event:
    slot: btn_7
    value: 1
  amp_run_event:
    slot: btn_8
    value: 1
  toggle_dance_pause_event:
    slot: btn_9
    value: 1
  toggle_nav_ctrl_event:
    slot: btn_9
    value: 2
  forward_flip_event:
    slot: btn_10
    value: 2
  applause_event:
    slot: btn_10
    value: 5
  hello_event:
    slot: btn_10
    value: 6
transition_profiles:
  instant:
    duration: 0.0
    exit_behavior: none
    enter_behavior: none
  soft_switch:
    duration: 0.02
    exit_behavior: hold_last_motor
    enter_behavior: hold_last_motor
  first_frame_switch:
    exit_duration: 0.02
    enter_duration: 0.1
    exit_behavior: hold_last_motor
    enter_behavior: first_frame_ramp_kp
    data:
      kp_start: zero
      kd_start: target
  dual_running_blend:
    duration: 0.3
    exit_behavior: none
    enter_behavior: dual_running_blend
    data:
      curve: smoothstep
      run_from: true
      run_to: true
      from_fallback: last_motor
      to_fallback: first_frame
speed_profiles:
  normal:
    vx_scale: 1.0
    vx_min: -1.0
    vx_max: 1.0
    vy_scale: 0.5
    yaw_scale: 1.5
  normal_run:
    vx_scale: 2.0
    vx_min: -1.0
    vx_max: 2.0
    vy_scale: 0.5
    yaw_scale: 1.0
  amp_run:
    vx_scale: 4.0
    vx_min: -2.0
    vx_max: 4.0
    vy_scale: 0.5
    yaw_scale: 1.5
states:
  normal:
    label: 走路
    behavior: NormalState
    speed_profile: normal
    transitions:
      on_event:
        zero_torque_event: zero_torque
        pd_brake_event:
          to: pd_brake
          transition:
            base: first_frame_switch
            enter_duration: 1.0
        initial_pos_event:
          to: initial_pos
          transition:
            base: first_frame_switch
            enter_duration: 1.0
        amp_run_event:
          to: amp_run
          transition: soft_switch
        normal_run_event:
          to: normal_run
          transition: soft_switch
        dance_event:
          to: dance
          transition: soft_switch
        recover_event:
          to: recover
          transition: soft_switch
        forward_flip_event:
          to: forward_flip
          transition: soft_switch
        applause_event:
          to: applause
          transition: dual_running_blend
        hello_event:
          to: hello
          transition: dual_running_blend
        toggle_nav_ctrl_event:
          action: toggle_nav_ctrl
  zero_torque:
    label: 零力矩
    behavior: ZeroTorqueState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch
        pd_brake_event:
          to: pd_brake
          transition:
            base: first_frame_switch
            enter_duration: 1.0
        initial_pos_event:
          to: initial_pos
          transition:
            base: first_frame_switch
            enter_duration: 1.0
        recover_event:
          to: recover
          transition:
            base: first_frame_switch
            enter_duration: 1.0
  pd_brake:
    label: 初始姿态
    behavior: PdBrakeState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch
        zero_torque_event: zero_torque
        initial_pos_event:
          to: initial_pos
          transition:
            base: first_frame_switch
            enter_duration: 1.0
        recover_event:
          to: recover
          transition:
            base: first_frame_switch
            enter_duration: 1.0
  initial_pos:
    label: 零位
    behavior: InitialPosState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch
        pd_brake_event:
          to: pd_brake
          transition:
            base: first_frame_switch
            enter_duration: 1.0
        zero_torque_event: zero_torque
        recover_event:
          to: recover
          transition: soft_switch
  dance:
    label: 跳舞
    behavior: DanceState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition:
            base: dual_running_blend
            duration: 1.0
        toggle_dance_pause_event:
          action: toggle_dance_pause
  recover:
    label: 起身
    behavior: RecoverState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch
        zero_torque_event: zero_torque
        pd_brake_event: pd_brake
        initial_pos_event: initial_pos
  amp_run:
    label: 高速奔跑
    behavior: AmpRunState
    speed_profile: amp_run
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch
  normal_run:
    label: 中速奔跑
    behavior: NormalRunState
    speed_profile: normal_run
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch
  forward_flip:
    label: 前空翻
    behavior: ForwardFlipState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition:
            base: dual_running_blend
            duration: 2.0
        zero_torque_event: zero_torque
  applause:
    label: 鼓掌
    behavior: ApplauseState
    speed_profile: normal
    transitions:
      on_event:
        normal_event:
          to: normal
          transition:
            base: dual_running_blend
            duration: 1.0
        toggle_dance_pause_event:
          action: toggle_dance_pause
  hello:
    label: 挥手
    behavior: HelloState
    speed_profile: normal
    transitions:
      on_event:
        normal_event:
          to: normal
          transition:
            base: dual_running_blend
            duration: 1.0
        toggle_dance_pause_event:
          action: toggle_dance_pause
