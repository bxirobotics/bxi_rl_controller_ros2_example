# 系统级配置。状态、事件、速度配置和状态图由各 Mod 的 mod.yaml 提供。
initial_state: com.bxi.basic_actions/zero_torque

# 可追加客户 Mod 根目录；内置 Mods 总是从安装包的 mods/ 自动发现。
mod_paths: []

graph:
  validate: true
  export:
    dot: /tmp/elf3_state_machine.dot
    mermaid: /tmp/elf3_state_machine.mmd

default_transition: instant

# 系统共享的过渡预设。Mod 也可以在自己的 mod.yaml 中新增命名空间预设。
transition_profiles:
  instant:
    type: instant

  soft_switch:
    type: hold
    duration: 0.02

  first_frame_switch:
    type: sequence
    steps:
      - type: hold
        duration: 0.02
      - type: entry_gain_ramp
        duration: 1.0
        kp_from: zero
        kd_from: target

  dual_running_blend:
    type: running_blend
    duration: 0.3
    curve: smoothstep
    sample_from: true
    sample_to: true
    advance_from: false
    advance_to: false
