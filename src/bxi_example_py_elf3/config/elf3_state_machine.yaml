#程序初始的状态
initial_state: zero_torque

#状态机可视化输出
graph:
  validate: true
  export:
    dot: /tmp/elf3_state_machine.dot
    mermaid: /tmp/elf3_state_machine.mmd

#将MotionCommands映射为事件
remote_events:
  normal_event:
    slot: btn_1
    value: 1
  zero_torque_event:
    slot: btn_2
    value: 1
  pd_brake_event:
    slot: btn_3
    value: 1
  initial_pos_event:
    slot: btn_4
    value: 1
  dance_event:
    slot: btn_5
    value: 1
  recover_event:
    slot: btn_6
    value: 1
  normal_run_event:
    slot: btn_7
    value: 1
  amp_run_event:
    slot: btn_8
    value: 1
  toggle_dance_pause_event:
    slot: btn_9
    value: 1
  toggle_nav_ctrl_event:
    slot: btn_9
    value: 2
  back_flip_event:
    slot: btn_10
    value: 1
  forward_flip_event:
    slot: btn_10
    value: 2
  applause_event:
    slot: btn_10
    value: 3
  hello_event:
    slot: btn_10
    value: 4

  naotou_event:
    slot: btn_10
    value: 5

#预设的一些过度方式
transition_profiles:

  #直接切换状态，相当于不填transition
  instant:
    duration: 0.0
    exit_behavior: none
    enter_behavior: none

  #软切换，会保持一段时间当前电机状态再切换下一状态
  soft_switch:
    duration: 0.02
    exit_behavior: hold_last_motor
    enter_behavior: hold_last_motor

  #缓慢增加kp或kd过度到目标状态的第一帧
  first_frame_switch:
    exit_duration: 0.02
    enter_duration: 0.1
    exit_behavior: hold_last_motor
    enter_behavior: first_frame_ramp_kp
    data:
      kp_start: zero #kp从0开始过度到目标状态的kp
      kd_start: target #kd从目标状态的kd开始过度

  #旧状态和新状态都持续生成电机目标，再按进入进度混合输出
  dual_running_blend:
    duration: 0.3
    exit_behavior: none
    enter_behavior: dual_running_blend
    data:
      curve: smoothstep
      run_from: true #是否采样当前状态电机
      run_to: true #是否采样目标状态电机
      from_fallback: last_motor 
      to_fallback: first_frame

#速度的预设配置
speed_profiles:
  normal:
    vx_scale: 1.0
    vx_min: -1.0
    vx_max: 1.0
    vy_scale: 0.5
    yaw_scale: 1.5

  normal_run:
    vx_scale: 2.0
    vx_min: -1.0
    vx_max: 2.0
    vy_scale: 0.5
    yaw_scale: 1.0

  amp_run:
    vx_scale: 4.0
    vx_min: -2.0
    vx_max: 4.0
    vy_scale: 0.5
    yaw_scale: 1.5

#状态机
states:
  normal:
    behavior: NormalState
    speed_profile: normal
    transitions:
      on_event:
        zero_torque_event: zero_torque
        pd_brake_event: 
            to: pd_brake
            transition: 
              base: first_frame_switch
              enter_duration: 1.0
        initial_pos_event: 
            to: initial_pos
            transition: 
              base: first_frame_switch
              enter_duration: 1.0
        amp_run_event:
          to: amp_run
          transition: soft_switch
        normal_run_event:
          to: normal_run
          transition: soft_switch
        dance_event:
          to: dance
          transition: soft_switch
        recover_event:
          to: recover
          transition: soft_switch
        back_flip_event:
          to: back_flip
          transition: soft_switch
        forward_flip_event:
          to: forward_flip
          transition: soft_switch
        applause_event:
          to: applause
          transition: dual_running_blend
        hello_event:
          to: hello
          transition: dual_running_blend
        naotou_event:
          to: naotou
          transition: dual_running_blend
        toggle_nav_ctrl_event:
          action: toggle_nav_ctrl

  zero_torque:
    behavior: ZeroTorqueState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch
        pd_brake_event: 
          to: pd_brake
          transition: 
            base: first_frame_switch
            enter_duration: 1.0
        initial_pos_event: 
          to: initial_pos
          transition: 
            base: first_frame_switch
            enter_duration: 1.0
        recover_event:
          to: recover
          transition:
            base: first_frame_switch
            enter_duration: 1.0

  pd_brake:
    behavior: PdBrakeState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch
        zero_torque_event: zero_torque
        initial_pos_event: 
          to: initial_pos
          transition: 
            base: first_frame_switch
            enter_duration: 1.0
        recover_event:
          to: recover
          transition:
            base: first_frame_switch
            enter_duration: 1.0

  initial_pos:
    behavior: InitialPosState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch
        pd_brake_event: 
          to: pd_brake
          transition: 
            base: first_frame_switch
            enter_duration: 1.0
        zero_torque_event: zero_torque
        recover_event:
          to: recover
          transition: soft_switch

  dance:
    behavior: DanceState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: 
            base: dual_running_blend
            duration: 1.0
        toggle_dance_pause_event:
          action: toggle_dance_pause

  recover:
    behavior: RecoverState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch
        zero_torque_event: zero_torque
        pd_brake_event: pd_brake
        initial_pos_event: initial_pos

  amp_run:
    behavior: AmpRunState
    speed_profile: amp_run
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch

  normal_run:
    behavior: NormalRunState
    speed_profile: normal_run
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch

  back_flip:
    behavior: BackFlipState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: 
            base: dual_running_blend
            duration: 2.0
        zero_torque_event: zero_torque

  forward_flip:
    behavior: ForwardFlipState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: 
            base: dual_running_blend
            duration: 2.0
        zero_torque_event: zero_torque

  applause:
    behavior: ApplauseState
    speed_profile: normal
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: 
            base: dual_running_blend
            duration: 1.0
        toggle_dance_pause_event:
          action: toggle_dance_pause

  naotou:
    behavior: NaotouState
    speed_profile: normal
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: 
            base: dual_running_blend
            duration: 1.0
        toggle_dance_pause_event:
          action: toggle_dance_pause

  hello:
    behavior: HelloState
    speed_profile: normal
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: 
            base: dual_running_blend
            duration: 1.0
        toggle_dance_pause_event:
          action: toggle_dance_pause
