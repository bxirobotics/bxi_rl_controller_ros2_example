sources:
  gamepad:
    type: joystick
    device: /dev/input/js0
    axes:
      left_y: 3
      left_x: 0
      yaw: 6
      trigger_left: 5
      trigger_right: 4
    buttons:
      stop: 11
      start: 14
      lb: 6
      rb: 7
      a: 0
      b: 1
      x: 3
      y: 4

  keyboard:
    type: keyboard
    poll_timeout_us: 20000
    hold_ms: 200
    axes:
      vx: keyboard.axis.vx
      vy: keyboard.axis.vy
      yaw: keyboard.axis.yaw
    movement:
      forward: w
      backward: s
      yaw_left: a
      yaw_right: d
      strafe_left: q
      strafe_right: e
      stop: space
    keys:
      normal: {key: "1", source: key.normal}
      recover: {key: "2", source: key.recover}
      dance: {key: "3", source: key.dance}
      amp_run: {key: "4", source: key.amp_run}
      normal_run: {key: "5", source: key.normal_run}
      back_flip: {key: "6", source: key.back_flip}
      forward_flip: {key: "7", source: key.forward_flip}
      applause: {key: "8", source: key.applause}
      hello: {key: "9", source: key.hello}

controls:
  move.vx:
    type: analog
    sources:
      - source: gamepad.left_y
        direction: -1
      - source: keyboard.vx
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.03

  move.vy:
    type: analog
    sources:
      - source: gamepad.left_x
        direction: -1
      - source: keyboard.vy
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.03

  move.yaw:
    type: analog
    sources:
      - source: gamepad.yaw
        direction: -1
      - source: keyboard.yaw
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.05

  system.stop: {type: bool, source: gamepad.stop}
  system.start: {type: bool, source: gamepad.start}
  shoulder.left: {type: bool, source: gamepad.lb}
  shoulder.right: {type: bool, source: gamepad.rb}
  button.south: {type: bool, source: gamepad.a}
  button.east: {type: bool, source: gamepad.b}
  button.west: {type: bool, source: gamepad.x}
  button.north: {type: bool, source: gamepad.y}

  trigger.left:
    type: bool
    source: gamepad.trigger_left
    threshold: 0.85
    hysteresis: 0.05

  trigger.right:
    type: bool
    source: gamepad.trigger_right
    threshold: 0.85
    hysteresis: 0.05

  key.normal: {type: bool, source: keyboard.normal}
  key.recover: {type: bool, source: keyboard.recover}
  key.dance: {type: bool, source: keyboard.dance}
  key.amp_run: {type: bool, source: keyboard.amp_run}
  key.normal_run: {type: bool, source: keyboard.normal_run}
  key.back_flip: {type: bool, source: keyboard.back_flip}
  key.forward_flip: {type: bool, source: keyboard.forward_flip}
  key.applause: {type: bool, source: keyboard.applause}
  key.hello: {type: bool, source: keyboard.hello}

outputs:
  analog:
    vx: move.vx
    vy: move.vy
    yaw: move.yaw

  edge:
    - output: system.stop
      when: [system.stop]
    - output: system.start
      when: [system.start]

  level:
    - output: btn_1=1
      when:
        any:
          - [shoulder.right, button.west]
          - [key.normal]

    - output: btn_2=1
      when: [shoulder.right, button.south]

    - output: btn_3=1
      when: [shoulder.right, button.east]

    - output: btn_4=1
      when: [shoulder.right, button.north]

    - output: btn_5=1
      when:
        any:
          - [shoulder.left, button.west]
          - [key.dance]

    - output: btn_6=1
      when:
        any:
          - [shoulder.left, button.south]
          - [key.recover]

    - output: btn_7=1
      when:
        any:
          - [shoulder.left, button.east]
          - [key.normal_run]

    - output: btn_8=1
      when:
        any:
          - [shoulder.left, button.north]
          - [key.amp_run]

    - output: btn_9=1
      when:
        - button.west
        - released: shoulder.left
        - released: shoulder.right
        - released: trigger.left
        - released: trigger.right

    - output: btn_10=1
      when:
        any:
          - [trigger.left, button.west]
          - [key.back_flip]

    - output: btn_10=2
      when:
        any:
          - [trigger.left, button.north]
          - [key.forward_flip]

    - output: btn_10=3
      when:
        any:
          - [trigger.right, button.east]
          - [key.applause]

    - output: btn_10=4
      when:
        any:
          - [trigger.right, button.south]
          - [key.hello]

system:
  start:
    - "mkdir -p /var/log/bxi_log"
    - "ros2 launch bxi_example_py_elf3 example_demo_hw.launch.py > /var/log/bxi_log/$(date +%Y-%m-%d_%H-%M-%S)_elf.log 2>&1 &"
    - "ros2 launch bxi_example_bms bms.launch.py > /var/log/bxi_log/bms_$(date +%Y-%m-%d_%H-%M-%S)_bms.log 2>&1 &"
  stop:
    - "killall -SIGINT hardware_elf3"
    - "killall -SIGINT bxi_example_py_elf3"
    - "killall -SIGINT bxi_example_py_elf3_demo"
    - "killall -SIGINT bxi_bms"
    - "killall -SIGINT bxi_example_bms"

system_mutexes:
  robot_process:
    acquire: start
    release: stop

system_reset_motion_after:
  - start
  - stop
