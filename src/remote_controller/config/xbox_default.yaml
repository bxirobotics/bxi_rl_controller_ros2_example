inputs:
  selection:
    scan_interval_ms: 100
    promote_stable_ms: 500
sources:
  crsf:
    type: crsf
    device: /dev/ttyCRSF
    baud_rate: 921600
    priority: 100
    ready_timeout_ms: 1000
    loss_timeout_ms: 300
    cooldown_ms: 1000
    signals:
      crsf.left_x:
        from: crsf.channel.1
      crsf.left_y:
        from: crsf.channel.2
      crsf.trigger_right:
        from: crsf.channel.3
      crsf.right_x:
        from: crsf.channel.4
      crsf.right_y:
        from: crsf.channel.6
      crsf.trigger_left:
        from: crsf.channel.7
      crsf.button_group_a:
        from: crsf.channel.8
      crsf.button_group_b:
        from: crsf.channel.9
  gamepad:
    type: joystick
    device: /dev/input/jsBattleDragon
    priority: 50
    ready_timeout_ms: 1000
    loss_timeout_ms: 300
    cooldown_ms: 1000
    signals:
      gamepad.left_y:
        from: js.axis.3
      gamepad.left_x:
        from: js.axis.0
      gamepad.yaw:
        from: js.axis.6
      gamepad.trigger_left:
        from: js.axis.5
      gamepad.trigger_right:
        from: js.axis.4
      gamepad.stop:
        from: js.button.11
      gamepad.start:
        from: js.button.14
      gamepad.lb:
        from: js.button.6
      gamepad.rb:
        from: js.button.7
      gamepad.a:
        from: js.button.0
      gamepad.b:
        from: js.button.1
      gamepad.x:
        from: js.button.3
      gamepad.y:
        from: js.button.4
  keyboard:
    type: keyboard
    priority: 0
    ready_timeout_ms: 1000
    loss_timeout_ms: 300
    cooldown_ms: 1000
    poll_timeout_us: 20000
    hold_ms: 200
    stop: space
    signals:
      keyboard.vx:
        from: keyboard.axis
        negative: s
        positive: w
      keyboard.vy:
        from: keyboard.axis
        negative: d
        positive: a
      keyboard.yaw:
        from: keyboard.axis
        negative: e
        positive: q
      keyboard.normal:
        from: keyboard.key
        key: '1'
        hold_ms: 200
      keyboard.pd_break:
        from: keyboard.key
        key: '!'
      keyboard.recover:
        from: keyboard.key
        key: '2'
      keyboard.dance:
        from: keyboard.key
        key: '3'
      keyboard.amp_run:
        from: keyboard.key
        key: '4'
      keyboard.normal_run:
        from: keyboard.key
        key: '5'
      keyboard.forward_flip:
        from: keyboard.key
        key: '7'
      keyboard.applause:
        from: keyboard.key
        key: '8'
      keyboard.hello:
        from: keyboard.key
        key: '9'
curves:
  stick:
    type: expo
    deadzone: 0.03
    expo: 0.0
    limit:
    - -1.0
    - 1.0
    calibration:
      input:
      - -1.0
      - 0.0
      - 1.0
      output:
      - -1.0
      - 0.0
      - 1.0
controls:
  move.vx:
    type: analog
    mix: max_abs
    inputs:
    - source: gamepad.left_y
      direction: -1
      curve: stick
    - source: crsf.right_y
      direction: -1
      curve: stick
    - source: keyboard.vx
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.03
  move.vy:
    type: analog
    mix: max_abs
    inputs:
    - source: gamepad.left_x
      direction: -1
      curve: stick
    - source: crsf.left_x
      direction: -1
      curve: stick
    - source: keyboard.vy
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.03
  move.yaw:
    type: analog
    mix: max_abs
    inputs:
    - source: gamepad.yaw
      direction: -1
      curve: stick
    - source: keyboard.yaw
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.05
  crsf.yaw:
    type: analog
    mix: sum
    inputs:
    - name: dpad_left
      when:
      - crsf.button_group_b=dpad_left
      value: 1.0
    - name: dpad_right
      when:
      - crsf.button_group_b=dpad_right
      value: -1.0
    min: -1.0
    max: 1.0
    alpha: 0.05
  gamepad.stop_event:
    type: bool
    inputs:
    - source: gamepad.stop
  gamepad.start_event:
    type: bool
    inputs:
    - source: gamepad.start
  gamepad.lb_event:
    type: bool
    inputs:
    - source: gamepad.lb
  gamepad.rb_event:
    type: bool
    inputs:
    - source: gamepad.rb
  gamepad.a_event:
    type: bool
    inputs:
    - source: gamepad.a
  gamepad.b_event:
    type: bool
    inputs:
    - source: gamepad.b
  gamepad.x_event:
    type: bool
    inputs:
    - source: gamepad.x
  gamepad.y_event:
    type: bool
    inputs:
    - source: gamepad.y
  crsf.button_group_a:
    type: enum
    default: idle
    hysteresis: 0.03
    inputs:
    - source: crsf.button_group_a
    positions:
      a:
      - -1.0
      - -0.846
      b:
      - -0.845
      - -0.602
      x:
      - -0.601
      - -0.358
      y:
      - -0.357
      - -0.118
      idle:
      - -0.117
      - 0.114
      lstick:
      - 0.115
      - 0.351
      rstick:
      - 0.352
      - 1.0
  crsf.button_group_b:
    type: enum
    default: idle
    hysteresis: 0.03
    inputs:
    - source: crsf.button_group_b
    positions:
      lb:
      - -1.0
      - -0.846
      rb:
      - -0.845
      - -0.602
      back:
      - -0.601
      - -0.358
      start:
      - -0.357
      - -0.118
      idle:
      - -0.117
      - 0.114
      dpad_up:
      - 0.115
      - 0.351
      dpad_down:
      - 0.352
      - 0.596
      dpad_left:
      - 0.597
      - 0.841
      dpad_right:
      - 0.842
      - 1.0
  crsf.stop_event:
    type: bool
    inputs:
    - when:
      - crsf.button_group_b=start
      value: true
  crsf.start_event:
    type: bool
    inputs:
    - when:
      - crsf.button_group_a=rstick
      value: true
  crsf.lb_event:
    type: bool
    inputs:
    - when:
      - crsf.button_group_b=lb
      value: true
  crsf.rb_event:
    type: bool
    inputs:
    - when:
      - crsf.button_group_b=rb
      value: true
  crsf.a_event:
    type: bool
    inputs:
    - when:
      - crsf.button_group_a=a
      value: true
  crsf.b_event:
    type: bool
    inputs:
    - when:
      - crsf.button_group_a=b
      value: true
  crsf.x_event:
    type: bool
    inputs:
    - when:
      - crsf.button_group_a=x
      value: true
  crsf.y_event:
    type: bool
    inputs:
    - when:
      - crsf.button_group_a=y
      value: true
  system.stop_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.stop_event
        - crsf.stop_event
      value: true
  system.start_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.start_event
        - crsf.start_event
      value: true
  shoulder.left_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.lb_event
        - crsf.lb_event
      value: true
  shoulder.right_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.rb_event
        - crsf.rb_event
      value: true
  button.a_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.a_event
        - crsf.a_event
      value: true
  button.b_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.b_event
        - crsf.b_event
      value: true
  button.x_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.x_event
        - crsf.x_event
      value: true
  button.y_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.y_event
        - crsf.y_event
      value: true
  gamepad.trigger.left_event:
    type: bool
    threshold: 0.85
    hysteresis: 0.05
    inputs:
    - source: gamepad.trigger_left
  gamepad.trigger.right_event:
    type: bool
    threshold: 0.85
    hysteresis: 0.05
    inputs:
    - source: gamepad.trigger_right
  crsf.trigger.left_event:
    type: bool
    threshold: 0.5
    hysteresis: 0.05
    inputs:
    - source: crsf.trigger_left
  crsf.trigger.right_event:
    type: bool
    threshold: 0.5
    hysteresis: 0.05
    inputs:
    - source: crsf.trigger_right
  trigger.left_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.trigger.left_event
        - crsf.trigger.left_event
      value: true
  trigger.right_event:
    type: bool
    inputs:
    - when:
        any:
        - gamepad.trigger.right_event
        - crsf.trigger.right_event
      value: true
  keyboard.normal_event:
    type: bool
    inputs:
    - source: keyboard.normal
  keyboard.pd_break_event:
    type: bool
    inputs:
    - source: keyboard.pd_break
  keyboard.recover_event:
    type: bool
    inputs:
    - source: keyboard.recover
  keyboard.dance_event:
    type: bool
    inputs:
    - source: keyboard.dance
  keyboard.amp_run_event:
    type: bool
    inputs:
    - source: keyboard.amp_run
  keyboard.normal_run_event:
    type: bool
    inputs:
    - source: keyboard.normal_run
  keyboard.forward_flip_event:
    type: bool
    inputs:
    - source: keyboard.forward_flip
  keyboard.applause_event:
    type: bool
    inputs:
    - source: keyboard.applause
  keyboard.hello_event:
    type: bool
    inputs:
    - source: keyboard.hello
outputs:
  conflict_policy: first_wins
  publish_on_change: true
  analog:
    vx: move.vx
    vy: move.vy
    yaw:
      controls:
      - move.yaw
      - crsf.yaw
      mix: max_abs
  edge:
  - output: system.stop
    when:
    - system.stop_event
  - output: system.start
    when:
    - system.start_event
  level:
  - output: btn_1=1
    when:
      any:
      - - shoulder.right_event
        - button.x_event
      - - keyboard.normal_event
  - output: btn_2=1
    when:
    - shoulder.right_event
    - button.a_event
  - output: btn_3=1
    when:
      any:
      - - shoulder.right_event
        - button.b_event
      - - keyboard.pd_break_event
  - output: btn_4=1
    when:
      any:
      - - shoulder.right_event
        - button.y_event
  - output: btn_5=1
    when:
      any:
      - - shoulder.left_event
        - button.x_event
      - - keyboard.dance_event
  - output: btn_6=1
    when:
      any:
      - - shoulder.left_event
        - button.a_event
      - - keyboard.recover_event
  - output: btn_7=1
    when:
      any:
      - - shoulder.left_event
        - button.b_event
      - - keyboard.normal_run_event
  - output: btn_8=1
    when:
      any:
      - - shoulder.left_event
        - button.y_event
      - - keyboard.amp_run_event
  - output: btn_9=1
    when:
    - button.x_event
    - released: shoulder.left_event
    - released: shoulder.right_event
    - released: trigger.left_event
    - released: trigger.right_event
  - output: btn_10=2
    when:
      any:
      - - trigger.left_event
        - button.y_event
      - - keyboard.forward_flip_event
  - output: btn_10=4
    when:
      any:
      - - trigger.left_event
        - button.b_event
  - output: btn_10=5
    when:
      any:
      - - trigger.right_event
        - button.b_event
      - - keyboard.applause_event
  - output: btn_10=6
    when:
      any:
      - - trigger.right_event
        - button.a_event
      - - keyboard.hello_event
system:
  start:
  - mkdir -p /var/log/bxi_log
  - ros2 launch bxi_example_py_elf3 example_demo_hw.launch.py > /var/log/bxi_log/$(date
    +%Y-%m-%d_%H-%M-%S)_elf.log 2>&1 &
  - ros2 launch bxi_example_bms bms.launch.py > /var/log/bxi_log/bms_$(date +%Y-%m-%d_%H-%M-%S)_bms.log
    2>&1 &
  - su bxi -c "cd /home/bxi/bxi_ws/bxi_voice && ./bin/bxi-voice" 2>&1 &
  stop:
  - killall -SIGINT hardware_elf3
  - killall -SIGINT bxi_example_py_elf3
  - killall -SIGINT bxi_example_py_elf3_demo
  - killall -SIGINT bxi_bms
  - killall -SIGINT bxi_example_bms
  - killall -SIGINT bxi-voice
system_mutexes:
  robot_process:
    acquire: start
    release: stop
system_reset_motion_after:
- start
- stop
