#自定义命令
system:
  start:
    - "mkdir -p /var/log/bxi_log"
    - "ros2 launch bxi_example_py_elf3 example_demo_hw.launch.py > /var/log/bxi_log/$(date +%Y-%m-%d_%H-%M-%S)_elf.log 2>&1 &"
    - "ros2 launch bxi_example_bms bms.launch.py > /var/log/bxi_log/bms_$(date +%Y-%m-%d_%H-%M-%S)_bms.log 2>&1 &"
    - "su bxi -c \"cd /home/bxi/bxi_ws/bxi_voice && ./bin/bxi-voice\" 2>&1 &"
  stop:
    # Stop the launch parents by full command line.  Killing only node
    # executable names can leave "ros2 launch ... example_demo_hw.launch.py"
    # alive; that parent keeps /tmp/bxi_example_hw.lock held and blocks the
    # next start.
    - "pkill -SIGINT -f '[r]os2 launch bxi_example_py_elf3 .*demo_hw.*\\.py|[h]ardware_elf3|[b]xi_example_py_elf3_demo|[/]bxi_depth_camera/cameras|[b]xi_depth_camera\\.manager' || true"
    - "pkill -SIGINT -f '[r]os2 launch bxi_example_bms bms\\.launch\\.py|[/]bxi_bms|[/]bxi_example_bms' || true"
    - "pkill -SIGINT -f '[b]xi-voice' || true"
    - "sleep 2"
    - "pkill -SIGTERM -f '[r]os2 launch bxi_example_py_elf3 .*demo_hw.*\\.py|[h]ardware_elf3|[b]xi_example_py_elf3_demo|[/]bxi_depth_camera/cameras|[b]xi_depth_camera\\.manager' || true"
    - "sleep 1"
    - "pkill -SIGKILL -f '[r]os2 launch bxi_example_py_elf3 .*demo_hw.*\\.py|[h]ardware_elf3|[b]xi_example_py_elf3_demo|[/]bxi_depth_camera/cameras|[b]xi_depth_camera\\.manager' || true"
    - "pkill -SIGKILL -f '[r]os2 launch bxi_example_bms bms\\.launch\\.py|[/]bxi_bms|[/]bxi_example_bms' || true"
    - "pkill -SIGKILL -f '[b]xi-voice' || true"

#互斥定义，只能acquire一次，但是可以release多次
system_mutexes:
  robot_process:
    acquire: start
    release: stop

#重置摇杆的滤波器
system_reset_motion_after:
  - start
  - stop
