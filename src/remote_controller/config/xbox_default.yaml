inputs:
  # 所有候选设备严格独占。系统每 100 ms 扫描可用性；设备持续可用
  # 500 ms 才允许抢占低优先级设备，避免插拔抖动造成频繁切换。
  selection:
    scan_interval_ms: 100
    promote_stable_ms: 500

sources:
  # CRSF 接收机。只有持续收到 CRC 正确的 RC 通道帧才会参与候选选择。
  # 16 路 RC 通道在这里映射为与 Xbox 相同的语义输入，业务动作仍由
  # controls/outputs 统一定义，因此可以复用手柄的全部组合键行为。
  crsf:
    type: crsf
    device: /dev/ttyCRSF
    baud_rate: 460800
    priority: 100
    ready_timeout_ms: 1000
    loss_timeout_ms: 300
    cooldown_ms: 1000
    signals:
      crsf.left_x:       {from: crsf.channel.1}   # CH1 Roll
      crsf.left_y:       {from: crsf.channel.2}   # CH2 Pitch
      crsf.trigger_right: {from: crsf.channel.3}  # CH3 Throttle / RT
      crsf.right_x:      {from: crsf.channel.4}   # CH4 Yaw
      crsf.right_y:      {from: crsf.channel.5}   # CH5 Camera Y
      crsf.trigger_left: {from: crsf.channel.6}   # CH6 Brake / LT
      crsf.a:            {from: crsf.channel.7}   # CH7
      crsf.b:            {from: crsf.channel.8}   # CH8
      crsf.x:            {from: crsf.channel.9}   # CH9
      crsf.y:            {from: crsf.channel.10}  # CH10
      crsf.lb:           {from: crsf.channel.11}  # CH11
      crsf.rb:           {from: crsf.channel.12}  # CH12
      crsf.start:        {from: crsf.channel.13}  # CH13
      crsf.stop:         {from: crsf.channel.14}  # CH14 / Back
      crsf.dpad_x:       {from: crsf.channel.15}  # CH15 left / center / right
      crsf.dpad_y:       {from: crsf.channel.16}  # CH16 down / center / up

  #手柄按键配置
  gamepad:
    type: joystick
    device: /dev/input/jsBattleDragon
    priority: 50
    ready_timeout_ms: 1000
    loss_timeout_ms: 300
    cooldown_ms: 1000
    signals:
      #ps4
      # gamepad.left_y: {from: js.axis.4}
      # gamepad.left_x: {from: js.axis.0}
      # gamepad.yaw: {from: js.axis.6}
      # gamepad.trigger_left: {from: js.axis.2}
      # gamepad.trigger_right: {from: js.axis.5}
      # gamepad.stop: {from: js.button.9}
      # gamepad.start: {from: js.button.10}
      # gamepad.lb: {from: js.button.4}
      # gamepad.rb: {from: js.button.5}
      # gamepad.a: {from: js.button.0}
      # gamepad.b: {from: js.button.1}
      # gamepad.x: {from: js.button.2}
      # gamepad.y: {from: js.button.3}
      #xbox
      gamepad.left_y: {from: js.axis.3}
      gamepad.left_x: {from: js.axis.0}
      gamepad.yaw: {from: js.axis.6}
      gamepad.trigger_left: {from: js.axis.5}
      gamepad.trigger_right: {from: js.axis.4}
      gamepad.stop: {from: js.button.11}
      gamepad.start: {from: js.button.14}
      gamepad.lb: {from: js.button.6}
      gamepad.rb: {from: js.button.7}
      gamepad.a: {from: js.button.0}
      gamepad.b: {from: js.button.1}
      gamepad.x: {from: js.button.3}
      gamepad.y: {from: js.button.4}

  #键盘按键配置
  keyboard:
    type: keyboard
    priority: 0
    ready_timeout_ms: 1000
    loss_timeout_ms: 300
    cooldown_ms: 1000
    poll_timeout_us: 20000
    hold_ms: 200
    stop: space
    signals:
      keyboard.vx: {from: keyboard.axis, negative: s, positive: w}
      keyboard.vy: {from: keyboard.axis, negative: d, positive: a}
      keyboard.yaw: {from: keyboard.axis, negative: e, positive: q}
      keyboard.normal: {from: keyboard.key, key: "1", hold_ms: 200}
      keyboard.pd_break: {from: keyboard.key, key: "!"}
      keyboard.recover: {from: keyboard.key, key: "2"}
      keyboard.dance: {from: keyboard.key, key: "3"}
      keyboard.amp_run: {from: keyboard.key, key: "4"}
      keyboard.normal_run: {from: keyboard.key, key: "5"}
      keyboard.back_flip: {from: keyboard.key, key: "6"}
      keyboard.forward_flip: {from: keyboard.key, key: "7"}
      keyboard.applause: {from: keyboard.key, key: "8"}
      keyboard.hello: {from: keyboard.key, key: "9"}

#预设的一些，输入曲线
curves:
  stick:
    type: expo
    deadzone: 0.03
    expo: 0.0
    limit: [-1.0, 1.0]
    calibration:
      input: [-1.0, 0.0, 1.0]
      output: [-1.0, 0.0, 1.0]

#处理来自不同source的输入，映射到统一的controls
controls:
  move.vx:
    type: analog
    mix: max_abs
    sources:
      - source: gamepad.left_y
        direction: -1
        curve: stick
      # CH2 对应 Xbox 左摇杆 Y；反向后与手柄前后方向一致。
      - source: crsf.left_y
        direction: -1
        curve: stick
      - source: keyboard.vx
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.03

  move.vy:
    type: analog
    mix: max_abs
    sources:
      - source: gamepad.left_x
        direction: -1
        curve: stick
      # CH1 对应 Xbox 左摇杆 X，沿用手柄横移方向。
      - source: crsf.left_x
        direction: -1
        curve: stick
      - source: keyboard.vy
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.03

  move.yaw:
    type: analog
    mix: max_abs
    sources:
      - source: gamepad.yaw
        direction: -1
        curve: stick
      # CH4 对应 Xbox 右摇杆 X，沿用手柄偏航方向。
      - source: crsf.right_x
        direction: -1
        curve: stick
      - source: keyboard.yaw
    deadzone: 0.03
    min: -1.0
    max: 1.0
    alpha: 0.05

  # 手柄保持原有的 0/1 按键阈值；CRSF AUX 按钮使用独立的二段判定。
  gamepad.stop_event: {type: bool, source: gamepad.stop}
  gamepad.start_event: {type: bool, source: gamepad.start}
  gamepad.lb_event: {type: bool, source: gamepad.lb}
  gamepad.rb_event: {type: bool, source: gamepad.rb}
  gamepad.a_event: {type: bool, source: gamepad.a}
  gamepad.b_event: {type: bool, source: gamepad.b}
  gamepad.x_event: {type: bool, source: gamepad.x}
  gamepad.y_event: {type: bool, source: gamepad.y}

  crsf.stop_event: {type: bool, source: crsf.stop, threshold: 0.5, hysteresis: 0.05}
  crsf.start_event: {type: bool, source: crsf.start, threshold: 0.5, hysteresis: 0.05}
  crsf.lb_event: {type: bool, source: crsf.lb, threshold: 0.5, hysteresis: 0.05}
  crsf.rb_event: {type: bool, source: crsf.rb, threshold: 0.5, hysteresis: 0.05}
  crsf.a_event: {type: bool, source: crsf.a, threshold: 0.5, hysteresis: 0.05}
  crsf.b_event: {type: bool, source: crsf.b, threshold: 0.5, hysteresis: 0.05}
  crsf.x_event: {type: bool, source: crsf.x, threshold: 0.5, hysteresis: 0.05}
  crsf.y_event: {type: bool, source: crsf.y, threshold: 0.5, hysteresis: 0.05}

  system.stop_event:
    type: bool
    expr:
      any: [[gamepad.stop_event], [crsf.stop_event]]
  system.start_event:
    type: bool
    expr:
      any: [[gamepad.start_event], [crsf.start_event]]
  shoulder.left_event:
    type: bool
    expr:
      any: [[gamepad.lb_event], [crsf.lb_event]]
  shoulder.right_event:
    type: bool
    expr:
      any: [[gamepad.rb_event], [crsf.rb_event]]
  button.a_event:
    type: bool
    expr:
      any: [[gamepad.a_event], [crsf.a_event]]
  button.b_event:
    type: bool
    expr:
      any: [[gamepad.b_event], [crsf.b_event]]
  button.x_event:
    type: bool
    expr:
      any: [[gamepad.x_event], [crsf.x_event]]
  button.y_event:
    type: bool
    expr:
      any: [[gamepad.y_event], [crsf.y_event]]

  gamepad.trigger.left_event:
    type: bool
    source: gamepad.trigger_left
    threshold: 0.85
    hysteresis: 0.05
  gamepad.trigger.right_event:
    type: bool
    source: gamepad.trigger_right
    threshold: 0.85
    hysteresis: 0.05
  crsf.trigger.left_event:
    type: bool
    source: crsf.trigger_left
    threshold: 0.5
    hysteresis: 0.05
  crsf.trigger.right_event:
    type: bool
    source: crsf.trigger_right
    threshold: 0.5
    hysteresis: 0.05
  trigger.left_event:
    type: bool
    expr:
      any: [[gamepad.trigger.left_event], [crsf.trigger.left_event]]
  trigger.right_event:
    type: bool
    expr:
      any: [[gamepad.trigger.right_event], [crsf.trigger.right_event]]

  keyboard.normal_event: {type: bool, source: keyboard.normal}
  keyboard.pd_break_event: {type: bool, source: keyboard.pd_break}
  keyboard.recover_event: {type: bool, source: keyboard.recover}
  keyboard.dance_event: {type: bool, source: keyboard.dance}
  keyboard.amp_run_event: {type: bool, source: keyboard.amp_run}
  keyboard.normal_run_event: {type: bool, source: keyboard.normal_run}
  keyboard.back_flip_event: {type: bool, source: keyboard.back_flip}
  keyboard.forward_flip_event: {type: bool, source: keyboard.forward_flip}
  keyboard.applause_event: {type: bool, source: keyboard.applause}
  keyboard.hello_event: {type: bool, source: keyboard.hello}

#将统一的controls映射到输出
outputs:
  conflict_policy: first_wins
  publish_on_change: true

  #连续的模拟值
  analog:
    vx: move.vx
    vy: move.vy
    yaw: move.yaw

  #上升沿触发，满足条件会输出目标值随后恢复为0
  edge:
    #sysyem.<name>代表触发下面的特定命令
    - output: system.stop
      when: [system.stop_event]
    - output: system.start
      when: [system.start_event]

  #电平触发，满足条件会一直输出
  level:
    - output: btn_1=1
      when:
        any:
          - [shoulder.right_event, button.x_event]
          - [keyboard.normal_event]

    - output: btn_2=1
      when: [shoulder.right_event, button.a_event]

    - output: btn_3=1
      when: 
        any:
          - [shoulder.right_event, button.b_event]
          - [keyboard.pd_break_event]

    - output: btn_4=1
      when:
        any:
          - [shoulder.right_event, button.y_event]

    - output: btn_5=1
      when:
        any:
          - [shoulder.left_event, button.x_event]
          - [keyboard.dance_event]

    - output: btn_6=1
      when:
        any:
          - [shoulder.left_event, button.a_event]
          - [keyboard.recover_event]

    - output: btn_7=1
      when:
        any:
          - [shoulder.left_event, button.b_event]
          - [keyboard.normal_run_event]

    - output: btn_8=1
      when:
        any:
          - [shoulder.left_event, button.y_event]
          - [keyboard.amp_run_event]

    - output: btn_9=1
      when:
        - button.x_event
        - released: shoulder.left_event
        - released: shoulder.right_event
        - released: trigger.left_event
        - released: trigger.right_event

    - output: btn_10=1
      when:
        any:
          - [trigger.left_event, button.x_event]
          - [keyboard.back_flip_event]

    - output: btn_10=2
      when:
        any:
          - [trigger.left_event, button.y_event]
          - [keyboard.forward_flip_event]

    - output: btn_10=3
      when:
        any:
          - [trigger.left_event, button.a_event]

    - output: btn_10=4
      when:
        any:
          - [trigger.left_event, button.b_event]

    - output: btn_10=5
      when:
        any:
          - [trigger.right_event, button.b_event]
          - [keyboard.applause_event]

    - output: btn_10=6
      when:
        any:
          - [trigger.right_event, button.a_event]
          - [keyboard.hello_event]

#自定义命令
system:
  start:
    - "mkdir -p /var/log/bxi_log"
    - "ros2 launch bxi_example_py_elf3 example_demo_hw.launch.py > /var/log/bxi_log/$(date +%Y-%m-%d_%H-%M-%S)_elf.log 2>&1 &"
    - "ros2 launch bxi_example_bms bms.launch.py > /var/log/bxi_log/bms_$(date +%Y-%m-%d_%H-%M-%S)_bms.log 2>&1 &"
    - "su bxi -c \"cd /home/bxi/bxi_ws/bxi_voice && ./bin/bxi-voice\" 2>&1 &"
  stop:
    - "killall -SIGINT hardware_elf3"
    - "killall -SIGINT bxi_example_py_elf3"
    - "killall -SIGINT bxi_example_py_elf3_demo"
    - "killall -SIGINT bxi_bms"
    - "killall -SIGINT bxi_example_bms"
    - "killall -SIGINT bxi-voice"

#互斥定义，只能acquire一次，但是可以release多次
system_mutexes:
  robot_process:
    acquire: start
    release: stop

#重置摇杆的滤波器
system_reset_motion_after:
  - start
  - stop
